services:
  - type: web
    name: telegram-demo-number-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot.main:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: FAMGATEWAY_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_NUMBER_PRICE_INR
        value: "29"
      - key: ADMIN_IDS
        sync: false
